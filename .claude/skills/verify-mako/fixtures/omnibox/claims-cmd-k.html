<!doctype html><meta charset="utf-8"><title>Claims K 0</title><p>Takes ⌘K for a palette of its own, as GitHub, Slack and Linear do; the title counts the presses it got.
<script>let n = 0; addEventListener('keydown', e => { if (e.metaKey && e.key === 'k') { e.preventDefault(); document.title = 'Claims K ' + ++n } })</script>
